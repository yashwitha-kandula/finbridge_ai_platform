services:
  # Backend Web Service (FastAPI)
  - type: web
    name: finbridge-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finbridge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # Frontend Web Service (React/Vite)
  - type: web
    name: finbridge-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: finbridge-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # PostgreSQL Database
  - name: finbridge-db
    databaseName: finbridge
    user: admin
